<div class="content-container">
    <mat-card>
      <mat-card-title>Submit Crime Report</mat-card-title>
      <mat-card-content>
        <form (ngSubmit)="submit()">
          <mat-form-field appearance="outline">
            <mat-label>Name</mat-label>
            <input matInput [(ngModel)]="formData.name" name="name" readonly>
          </mat-form-field>
  
          <mat-form-field appearance="outline">
            <mat-label>Phone</mat-label>
            <input matInput [(ngModel)]="formData.phone" name="phone" type="tel" readonly>
          </mat-form-field>
  
          <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input matInput [(ngModel)]="formData.email" name="email" type="email" readonly>
          </mat-form-field>
  
          <mat-form-field appearance="outline">
            <mat-label>Unit #</mat-label>
            <input matInput [(ngModel)]="formData.unit" name="unit" type="number" readonly>
          </mat-form-field>
  
          <mat-form-field appearance="outline">
            <mat-label>Description</mat-label>
            <textarea matInput [(ngModel)]="formData.description" name="description" rows="5" required></textarea>
            <mat-error *ngIf="!formData.description">Description is required</mat-error>
          </mat-form-field>
  
          <div class="file-upload">
            <button mat-raised-button color="primary" type="button" (click)="openPhotoFileDialog()">
              Upload Photo
            </button>
            <input #photoFile type="file" accept="image/*" (change)="onFileChangePhoto($event)" style="display: none;">
            <span *ngIf="filePhoto">{{ filePhoto.name }}</span>
          </div>
  
          <div class="button-container">
            <button mat-raised-button color="primary" type="submit">Submit</button>
            <button mat-raised-button color="warn" type="button" (click)="cancel()">Cancel</button>
          </div>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
