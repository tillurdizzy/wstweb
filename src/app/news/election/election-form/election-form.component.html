<div class="menu-container">
  <p-button (click)="toggleMenu($event)" icon="pi pi-ellipsis-v" label="Elections Menu" severity="secondary"></p-button>
  <p-menu #menu [model]="items" [popup]="true"></p-menu>
</div>
<hr class="divider" />

<div class="content-container">
  <p-card>
    <ng-template #title>You Can Count on Me</ng-template>
    <div class="card-content">
      <div class="image-placeholder">
        <img src="election-form.png" alt="" />
      </div>

      <p>
        We have the votes to replace the Board. That's easy. We've had that both of the last two years.
        But we don't have the numbers to make quorum. Can we count on you?
      </p>

      <p>
        It's important we maintain an accurate list of who we can depend on to vote in next year's election.
      </p>

      <div class="signup">
        <p-fluid>
          <div class="field">
            <label for="name">Name</label>
            <input pInputText id="name" [(ngModel)]="form.name" />
          </div>
          <div class="field">
            <label for="unit">Unit #</label>
            <input pInputText id="unit" type="number" [(ngModel)]="form.unit" />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input pInputText id="email" type="email" [(ngModel)]="form.email" />
          </div>
          <div class="field">
            <label for="phone">Phone</label>
            <input pInputText id="phone" type="tel" [(ngModel)]="form.phone" />
          </div>
          <div class="field">
            <p-button label="Submit" [disabled]="sending" (click)="submit()"></p-button>
          </div>
        </p-fluid>
      </div>
    </div>
  </p-card>
  <p-toast></p-toast>
</div>
