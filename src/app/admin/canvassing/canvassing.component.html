<div class="content-container">
  <p-card>
    <ng-template #title>Canvassing</ng-template>
    <div class="card-content">
      <p class="for-percent">Voting FOR: {{ forPercent }}%</p>
      <div class="field">
        <select id="group" [(ngModel)]="group" (ngModelChange)="load()" [compareWith]="sameGroup">
          <option *ngFor="let g of groups" [ngValue]="g">{{ g.label }}</option>
        </select>
      </div>

      <table>
        <tbody>
          <tr *ngFor="let row of rows">
            <td class="icon">
              <p-button icon="pi pi-eye" [text]="true" (click)="openUnit(row.unit)"></p-button>
            </td>
            <td>
              {{ row.label }}
              <i *ngIf="voteIcon(row.vote)" class="vote-mark" [ngClass]="voteIcon(row.vote)"></i>
            </td>
            <td class="icon">
              <p-button *ngIf="row.note" icon="pi pi-file" [text]="true" (click)="showNote(row.note)"></p-button>
            </td>
          </tr>
          <tr *ngIf="rows.length === 0">
            <td colspan="3">None left in the {{ group.label }}.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </p-card>

  <p-dialog header="Latest note" [(visible)]="noteVisible" [modal]="true" [style]="{ width: '90vw', maxWidth: '420px' }">
    <p class="note">{{ noteText }}</p>
  </p-dialog>
</div>
