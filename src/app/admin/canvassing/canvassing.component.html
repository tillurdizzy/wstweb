<div class="content-container">
  <p-card>
    <ng-template #title>Canvassing</ng-template>
    <div class="card-content">
      <div class="field">
        <label for="group">Group</label>
        <select id="group" [(ngModel)]="group" (ngModelChange)="load()">
          <option *ngFor="let g of groups" [ngValue]="g">{{ g }}</option>
        </select>
      </div>

      <table>
        <tbody>
          <tr *ngFor="let row of rows">
            <td class="icon">
              <p-button icon="pi pi-file" [text]="true" (click)="openUnit(row.unit)"></p-button>
            </td>
            <td>{{ row.label }}</td>
            <td class="icon">
              <p-button icon="pi pi-eye" [text]="true" (click)="showNote(row.note)"></p-button>
            </td>
          </tr>
          <tr *ngIf="rows.length === 0">
            <td colspan="3">None left in group {{ group }}.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </p-card>

  <p-dialog header="Latest note" [(visible)]="noteVisible" [modal]="true" [style]="{ width: '90vw', maxWidth: '420px' }">
    <p class="note">{{ noteText }}</p>
  </p-dialog>
</div>
