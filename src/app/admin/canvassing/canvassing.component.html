<div class="content-container">
  <p-card>
    <ng-template #title>Canvassing</ng-template>
    <div class="card-content">
      <p class="for-percent">Voting FOR: {{ forPercent }}%</p>
      <div class="field">
        <select id="group" [(ngModel)]="group" (ngModelChange)="load()" [compareWith]="sameGroup">
          <option *ngFor="let g of groups" [ngValue]="g">{{ g.label }}</option>
        </select>
      </div>

      <table>
        <tbody>
          <tr *ngFor="let row of rows">
              <td class="icon">
              <p-button icon="pi pi-pencil" severity="secondary" (click)="openUnit(row.unit)"></p-button>
            </td>
            <td>
              {{ row.label }}
              <span
                *ngIf="voteMark(row.vote, row.proxy) as mark"
                class="vote-box"
                [ngClass]="mark.tone"
              >
                <i class="pi" [ngClass]="mark.icon"></i>
              </span>
            </td>
            <td class="icon">
              <p-button icon="pi pi-comment" severity="secondary" (click)="showNote(row)"></p-button>
            </td>
          </tr>
          <tr *ngIf="rows.length === 0">
            <td colspan="3">None left in the {{ group.label }}.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </p-card>

  <p-dialog [(visible)]="noteVisible" [modal]="true" [style]="{ width: '92vw', maxWidth: '440px' }" [showHeader]="false">
    <h3 class="popup-title">Last Note:</h3>
    <p class="note">{{ noteText }}</p>
    <hr class="divider" />
    <h3 class="popup-title">Status</h3>
    <div class="check-list">
      <label *ngFor="let item of contactChoices">
        <input type="radio" name="contactChoice" [value]="item" [(ngModel)]="contactChoice" />
        {{ item }}
      </label>
    </div>
    <div class="field">
      <label for="contactNote">Notes</label>
      <textarea id="contactNote" rows="4" [(ngModel)]="contactNote"></textarea>
    </div>
    <p *ngIf="contactMessage">{{ contactMessage }}</p>
    <p-button label="Submit" [disabled]="savingContact" (click)="saveContact()"></p-button>
  </p-dialog>
    <p-dialog [(visible)]="savedVisible" [modal]="true" [closable]="false" [showHeader]="false" [style]="{ width: '240px' }">
    <p class="saved">Saved!</p>
    <p-button label="OK" (click)="savedVisible = false"></p-button>
  </p-dialog>
</div>
