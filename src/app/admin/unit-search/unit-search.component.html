<div class="content-container">
  <p-card>
    <ng-template #title>Unit Search</ng-template>
    <div class="card-content">
      <div class="search-input">
        <div class="search-section search-row">
          <label for="query">Unit number or owner name</label>
               <div class="search-controls">
        <input
          pInputText
          id="unitSearch"
          name="unitSearch"
          autocomplete="off"
          [(ngModel)]="query"
          (ngModelChange)="onQueryChange()"
          placeholder="Unit number or owner name"
        />
        <p-button label="Clear" severity="secondary" (click)="clearSearch()"></p-button>
        <p-button label="Prev" severity="secondary" [disabled]="!activeUnit" (click)="stepUnit(-1)"></p-button>
        <p-button label="Next" severity="secondary" [disabled]="!activeUnit" (click)="stepUnit(1)"></p-button>
      </div>
        </div>
      </div>

      <div class="search-section" *ngIf="searchResults.length > 0 && !activeUnit">
        <ul>
          <li *ngFor="let owner of searchResults">
            <p-button
              icon="pi pi-eye"
              styleClass="p-button-text"
              (click)="viewOwnerUnits(owner.owner_id)"
            ></p-button>
            {{ owner.firstname }} {{ owner.lastname }} ({{ owner.unitCount }} units)
          </li>
        </ul>
      </div>
      <p *ngIf="searched && searchResults.length === 0">No matches found.</p>
    </div>
  </p-card>
  <hr class="divider" />
  <app-units
    *ngIf="selectedOwnerId"
    [ownerIdInput]="selectedOwnerId"
    [unitInput]="activeUnit"
  ></app-units>

  <p-toast></p-toast>
  <p-confirmdialog></p-confirmdialog>
</div>
