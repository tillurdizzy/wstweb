<div class="content-container">
  <p-card>
    <ng-template #title>Quick Note</ng-template>
    <div class="card-content">
      <p>
        Information to record or follow up on. Unit # is the only required field.
      </p>

      <div class="signup">
        <p-fluid>
          <div class="field">
            <label for="unit">Unit #</label>
            <input pInputText id="unit" type="number" [(ngModel)]="form.unit" />
          </div>
          <div class="field">
            <label for="name">Name</label>
            <input pInputText id="name" [(ngModel)]="form.name" />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input pInputText id="email" type="email" [(ngModel)]="form.email" />
          </div>
          <div class="field">
            <label for="phone">Phone</label>
            <input pInputText id="phone" type="tel" [(ngModel)]="form.phone" />
          </div>
          <div class="field">
            <label for="notes">Notes</label>
            <textarea pTextarea id="notes" rows="6" [(ngModel)]="form.notes"></textarea>
          </div>
          <div class="field">
            <p-button label="Submit" [disabled]="sending" (click)="submit()"></p-button>
          </div>
        </p-fluid>
      </div>
    </div>
  </p-card>
  <p-toast></p-toast>
</div>
