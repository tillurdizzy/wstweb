<div class="login-container">
  <p-card>
    <ng-template pTemplate="header">
      <h3>Log In</h3>
    </ng-template>
    <div class="card-content">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="field">
          <label for="email">Email</label>
          <input pInputText id="email" formControlName="email" type="email" placeholder="your@email.com" />
          <small *ngIf="loginForm.get('email')?.hasError('required') && loginForm.get('email')?.touched" class="p-error">
            Email is required
          </small>
          <small *ngIf="loginForm.get('email')?.hasError('email') && loginForm.get('email')?.touched" class="p-error">
            Please enter a valid email
          </small>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <p-password id="password" formControlName="password" [toggleMask]="true" />
          <small *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched" class="p-error">
            Password is required
          </small>
        </div>

        <p-button label="Login" [disabled]="loading || loginForm.invalid" (click)="onSubmit()"></p-button>
      </form>

      <div class="actions">
        <a (click)="resetPassword()" class="forgot-password">Forgot Password?</a>
      </div>

      <p class="instructions">
        First-time users: Enter your email, click "Forgot Password" to set up your account, then log in with your new
        password.
      </p>
    </div>
  </p-card>
  <p-toast></p-toast> <!-- Toast for feedback messages -->
</div>
