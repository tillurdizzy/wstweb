<!-- newsletter.component.html -->
<div class="content-container">
  <p-card>
    <ng-template #title>Latest Newsletter</ng-template>
    <div class="card-content">
      <div *ngIf="pdfPath" class="pdf-container">
        <iframe [src]="pdfPath | safeUrl" width="100%" height="600px" type="application/pdf"></iframe>
      </div>
      <p *ngIf="!pdfPath">No newsletter available at this time.</p>
    </div>
  </p-card>
</div>
