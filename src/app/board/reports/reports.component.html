<div class="content-container">
    <mat-card>
      <mat-card-title>Latest Financial Report</mat-card-title>
      <mat-card-content>
        <div *ngIf="pdfPath" class="pdf-container">
          <iframe [src]="pdfPath | safeUrl" width="100%" height="600px" type="application/pdf"></iframe>
        </div>
        <p *ngIf="!pdfPath">No report available at this time.</p>
      </mat-card-content>
    </mat-card>
  </div>
