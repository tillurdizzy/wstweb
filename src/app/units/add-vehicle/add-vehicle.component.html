<div class="content-container">
  <p-card>
    <ng-template #title>Add Vehicle</ng-template>
    <div class="card-content">
      <p-fluid>
        <div class="form-container">
          <div class="field">
            <label for="make">Make</label>
            <input pInputText id="make" [(ngModel)]="vehicle.make" required />
            <small *ngIf="!vehicle.make" class="p-error">Make is required</small>
          </div>

          <div class="field">
            <label for="model">Model</label>
            <input pInputText id="model" [(ngModel)]="vehicle.model" required />
            <small *ngIf="!vehicle.model" class="p-error">Model is required</small>
          </div>

          <div class="field">
            <label for="color">Color</label>
            <input pInputText id="color" [(ngModel)]="vehicle.color" />
          </div>

          <div class="field">
            <label for="tag">License</label>
            <input pInputText id="tag" [(ngModel)]="vehicle.tag" required />
            <small *ngIf="!vehicle.tag" class="p-error">License is required</small>
          </div>

          <div class="field occupied-row">
            <p-checkbox inputId="data_confirmed" [(ngModel)]="dataConfirmed" [binary]="true"></p-checkbox>
            <label for="data_confirmed" class="checkbox-label">Data confirmed</label>
          </div>

          <div class="field">
            <p-button label="Save" (click)="save()"></p-button>
          </div>
          <div class="field">
            <p-button label="Cancel" (click)="cancel()" severity="secondary"></p-button>
          </div>
        </div>
      </p-fluid>
    </div>
  </p-card>
</div>
