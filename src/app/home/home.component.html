<div class="welcome-container">
  <h4 *ngIf="userEmail">Welcome, {{ userEmail }}!<span *ngIf="isAdmin"> (Admin)</span></h4>
  <p *ngIf="!userEmail">Not logged in.</p>
</div>

<div class="button-container">
  <button mat-raised-button color="primary" routerLink="/units">My Account</button>
  <button mat-raised-button color="primary" routerLink="/forms">Forms</button>
  <button mat-raised-button color="primary" routerLink="/newsletter">Newsletter</button>
  <button mat-raised-button color="primary" routerLink="/reports">Monthly Financial Report</button>
  <button mat-raised-button color="primary" routerLink="/committees">Committees</button>
  <button *ngIf="isAdmin" mat-raised-button color="accent" routerLink="/admin">Admin View</button>
</div>
